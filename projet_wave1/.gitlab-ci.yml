image: python:3.11-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DJANGO_SETTINGS_MODULE: "projet_wave1.settings"

  # PostgreSQL CI
  POSTGRES_DB: wave_test
  POSTGRES_USER: wave_user
  POSTGRES_PASSWORD: wave_pass
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: wave_test
  PGUSER: wave_user
  PGPASSWORD: wave_pass

cache:
  paths:
    - .cache/pip/

services:
  - name: postgres:15
    alias: postgres

default:
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements-dev.txt

lint:flake8:
  stage: lint
  script:
    - flake8 . --max-line-length=100 --extend-ignore=E203 --exclude=env/,venv/,migrations/,Echarts/,fichiers_code_jmerise/,sanstitre3.py
  allow_failure: false

test:unit:
  stage: test
  variables:
    SECRET_KEY: "test-secret-key-for-ci"
    DEBUG: "True"

  script:
    # attendre PostgreSQL
    - until pg_isready -h postgres -p 5432; do echo "waiting for postgres..."; sleep 1; done

    # tests Django (IMPORTANT: manage.py est à la racine)
    - python3 "$CI_PROJECT_DIR/manage.py" test kobe_wave

    # coverage
    - python3 -m coverage run "$CI_PROJECT_DIR/manage.py" test kobe_wave
    - python3 -m coverage report
    - python3 -m coverage xml

  coverage: '/TOTAL.*\s+(\d+%)$/'

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 3 months

  allow_failure: false